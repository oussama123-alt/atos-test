spring.application.name=atosTest

# --- Embedded H2 database (in-memory, recreated on every start) ---
spring.datasource.url=jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console available at http://localhost:8080/h2-console (JDBC URL above, user "sa", empty password)
spring.h2.console.enabled=true

# --- Registration business rules ---
registration.allowed-country=FR
registration.minimum-age=18

# --- Logging ---
logging.level.com.example.atosTest=INFO
